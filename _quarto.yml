project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - methodology.qmd
    - rules.qmd
    - robustness.qmd
    - leadership.qmd
    - reproducibility.qmd
    - license.qmd

website:
  title: "ATLAS Threshold Detection Rules Analysis"
  favicon: assets/images/favicon.svg
  search: false
  page-navigation: true
  sidebar:
    logo: assets/images/logo.svg
    logo-alt: "Seeking Eureka"
    style: floating
    contents:
      - href: index.qmd
        text: Overview
      - href: methodology.qmd
        text: Methodology
      - href: rules.qmd
        text: Rule Analysis
      - href: robustness.qmd
        text: Summary & Robustness
      - href: leadership.qmd
        text: For Leaders
      - href: reproducibility.qmd
        text: Reproducibility
  page-footer:
    center: "© 2026 Patrick Lefler ⦁ [MIT License](license.qmd) ⦁ Built with R & Quarto"

format:
  html:
    code-copy: true
    code-fold: true
    code-summary: "Display code"
    code-overflow: wrap
    code-tools: true
    df-print: paged
    fig-align: center
    fig-width: 10
    fig-height: 6
    highlight-style: arrow
    lightbox: true
    linkcolor: "#0166CC"
    number-sections: false
    page-layout: full
    smooth-scroll: true
    theme: [sandstone, theme.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "contents"

execute:
  echo: true
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: "#>"


